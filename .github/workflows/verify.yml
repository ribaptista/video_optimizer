name: verify

# Reusable: called by release.yml so a release can never publish an image
# that hasn't passed the exact same checks a PR has to pass. Also runs
# directly on push/pull_request so ordinary development gets CI for free.
on:
  workflow_call:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run verify

      # No test suite exists yet -- this is the cheapest possible smoke
      # check that the built CLI actually runs, catching e.g. a broken
      # shebang or a missing runtime import that `tsc`'s typecheck alone
      # wouldn't.
      - name: Smoke-test the built CLI
        run: node dist/cli.js --help
